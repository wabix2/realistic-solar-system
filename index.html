<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Solar RK4 - The Original Lab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root {
            --accent: #00f2fe;
            --glass: rgba(15, 15, 30, 0.9);
        }

        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; color: white; }
        
        /* The Original Side Panel Style */
        #panel {
            position: absolute;
            top: 20px; left: 20px;
            width: 300px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }

        h2 { margin: 0 0 15px 0; color: var(--accent); font-size: 1.5em; text-align: center; }

        .btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none; padding: 12px; color: #000; font-weight: bold;
            border-radius: 10px; cursor: pointer; transition: 0.3s; width: 100%; margin-bottom: 10px;
        }
        .btn:hover { transform: scale(1.02); filter: brightness(1.2); }
        .btn-sec { background: rgba(255,255,255,0.1); color: white; border: 1px solid var(--accent); }

        select, input {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid #444;
            color: white; padding: 10px; border-radius: 8px; margin-bottom: 15px;
        }

        /* The Team Section Popup */
        #teamBox {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 2px solid var(--accent);
            border-radius: 20px;
            padding: 25px;
            display: none;
            z-index: 1000;
        }

        .member { border-bottom: 1px solid rgba(255,255,255,0.1); padding: 8px 0; }
        .role { font-size: 0.75em; color: var(--accent); display: block; }
    </style>
</head>
<body>

<div id="panel">
    <h2>🌌 Solar Lab</h2>
    
    <label>Select & Track Planet</label>
    <select id="planetList" onchange="trackPlanet()">
        <option value="none">Free Roam</option>
        <option value="Sun">Sun</option>
        <option value="Mercury">Mercury</option>
        <option value="Venus">Venus</option>
        <option value="Earth">Earth</option>
        <option value="Mars">Mars</option>
        <option value="Jupiter">Jupiter</option>
        <option value="Saturn">Saturn</option>
        <option value="Uranus">Uranus</option>
        <option value="Neptune">Neptune</option>
    </select>

    <div style="display:flex; gap:10px;">
        <button class="btn" id="playBtn" onclick="toggleSim()">Pause Simulation</button>
    </div>

    <label>Simulation Speed</label>
    <input type="range" id="dt" min="0" max="0.05" step="0.001" value="0.015">

    <button class="btn btn-sec" onclick="document.getElementById('teamBox').style.display='block'">👥 About Team</button>
    <button class="btn btn-sec" onclick="location.reload()">Reset System</button>
</div>

<div id="teamBox">
    <h2 style="margin-top:0;">The Lab Team</h2>
    <div class="member"><span class="role">Lead Dev</span>Wabi</div>
    <div class="member"><span class="role">Programmer</span>Rakeb Tewodros</div>
    <div class="member"><span class="role">Researcher</span>Henok Yared</div>
    <div class="member"><span class="role">Presentation</span>Rediet</div>
    <div class="member"><span class="role">Researcher</span>Aklesiya Negalign</div>
    <div class="member"><span class="role">Support</span>Hemen Tadese</div>
    <div class="member"><span class="role">Coordinator</span>Arsema</div>
    <br>
    <button class="btn" onclick="document.getElementById('teamBox').style.display='none'">Close</button>
</div>

<script>
let scene, camera, renderer, controls, raycaster, mouse;
let bodies = [], meshes = [], trails = [];
let target = null, running = true, G = 6000;

function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 1, 100000);
    camera.position.set(0, 1500, 3000);

    renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Background Stars
    const geo = new THREE.BufferGeometry();
    const pos = [];
    for(let i=0; i<15000; i++) pos.push((Math.random()-0.5)*30000, (Math.random()-0.5)*30000, (Math.random()-0.5)*30000);
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    scene.add(new THREE.Points(geo, new THREE.PointsMaterial({color:0xffffff, size: 1})));

    scene.add(new THREE.AmbientLight(0x222222));
    setupSolarSystem();
}

const data = [
    { name: "Sun", m: 4000, d: 0, s: 120, c: 0xffaa00, v: 0 },
    { name: "Mercury", m: 5, d: 350, s: 10, c: 0x999999, v: 10 },
    { name: "Venus", m: 10, d: 550, s: 18, c: 0xeebb99, v: 8.5 },
    { name: "Earth", m: 10, d: 800, s: 20, c: 0x2288ff, v: 7.5 },
    { name: "Mars", m: 8, d: 1100, s: 15, c: 0xff5533, v: 6.5 },
    { name: "Jupiter", m: 200, d: 1800, s: 60, c: 0xffa500, v: 5.2 },
    { name: "Saturn", m: 150, d: 2600, s: 50, c: 0xeeddaa, v: 4.5 },
    { name: "Uranus", m: 80, d: 3600, s: 35, c: 0x88ffff, v: 3.8 },
    { name: "Neptune", m: 80, d: 4600, s: 35, c: 0x3366ff, v: 3.4 }
];

function setupSolarSystem() {
    data.forEach(p => {
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(p.s, 32, 32), new THREE.MeshPhongMaterial({color: p.c, emissive: p.name==="Sun"?p.c:0, emissiveIntensity: 1}));
        mesh.position.set(p.d, 0, 0);
        scene.add(mesh);
        
        if(p.name === "Sun") mesh.add(new THREE.PointLight(0xffffff, 2.5, 20000));
        
        bodies.push({ name: p.name, m: p.m, mesh, pos: new THREE.Vector3(p.d, 0, 0), vel: new THREE.Vector3(0, 0, p.v) });
        
        const trail = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({color: p.c, transparent:true, opacity:0.15}));
        trail.userData = { pts: [] };
        trails.push(trail);
        scene.add(trail);
    });
}

function rk4(dt) {
    const getAcc = (ps) => ps.map((p, i) => {
        let a = new THREE.Vector3();
        ps.forEach((p2, j) => {
            if(i !== j) {
                let diff = new THREE.Vector3().subVectors(p2, p);
                a.add(diff.normalize().multiplyScalar((G * bodies[j].m)/(diff.lengthSq()+10)));
            }
        });
        return a;
    });

    let p0 = bodies.map(b => b.pos.clone());
    let v0 = bodies.map(b => b.vel.clone());
    let a1 = getAcc(p0);
    let kv1 = a1.map(a => a.multiplyScalar(dt));
    let kp1 = v0.map(v => v.clone().multiplyScalar(dt));

    let p1 = p0.map((p, i) => p.clone().add(kp1[i].clone().multiplyScalar(0.5)));
    let kv2 = getAcc(p1).map(a => a.multiplyScalar(dt));
    let kp2 = v0.map((v, i) => v.clone().add(kv1[i].clone().multiplyScalar(0.5)).multiplyScalar(dt));

    let p2 = p0.map((p, i) => p.clone().add(kp2[i].clone().multiplyScalar(0.5)));
    let kv3 = getAcc(p2).map(a => a.multiplyScalar(dt));
    let kp3 = v0.map((v, i) => v.clone().add(kv2[i].clone().multiplyScalar(0.5)).multiplyScalar(dt));

    let p3 = p0.map((p, i) => p.clone().add(kp3[i]));
    let kv4 = getAcc(p3).map(a => a.multiplyScalar(dt));
    let kp4 = v0.map((v, i) => v.clone().add(kv3[i]).multiplyScalar(dt));

    bodies.forEach((b, i) => {
        b.vel.add(kv1[i].add(kv2[i].multiplyScalar(2)).add(kv3[i].multiplyScalar(2)).add(kv4[i]).multiplyScalar(1/6));
        b.pos.add(kp1[i].add(kp2[i].multiplyScalar(2)).add(kp3[i].multiplyScalar(2)).add(kp4[i]).multiplyScalar(1/6));
    });
}

function trackPlanet() {
    const val = document.getElementById('planetList').value;
    target = (val === "none") ? null : bodies.find(b => b.name === val);
}

function toggleSim() {
    running = !running;
    document.getElementById('playBtn').innerText = running ? "Pause Simulation" : "Start Simulation";
}

function animate() {
    requestAnimationFrame(animate);
    if(running) {
        const dt = parseFloat(document.getElementById('dt').value);
        rk4(dt);
        bodies.forEach((b, i) => {
            b.mesh.position.copy(b.pos);
            let pts = trails[i].userData.pts;
            pts.push(b.pos.clone());
            if(pts.length > 200) pts.shift();
            trails[i].geometry.setFromPoints(pts);
        });
    }
    if(target) controls.target.lerp(target.pos, 0.1);
    controls.update();
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

init();
animate();
</script>
</body>
</html>
