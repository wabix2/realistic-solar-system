<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interstellar RK4 - Mobile Optimized</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root {
            --neon: #00f2fe;
            --glass: rgba(0, 5, 15, 0.95);
            --font: 'Segoe UI', system-ui, sans-serif;
            --chem-accent: #39ff14;
            --astro-accent: #ff00ff;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: var(--font); color: white; }
        
        /* NAVIGATION BAR */
        #top-nav {
            position: fixed; top: 0; left: 0; width: 100%; height: 50px;
            background: var(--glass); border-bottom: 1px solid rgba(0, 242, 254, 0.3);
            display: flex; justify-content: center; align-items: center; z-index: 1000; gap: 15px;
        }

        .nav-tab {
            padding: 5px 12px; cursor: pointer; text-transform: uppercase;
            letter-spacing: 1px; font-weight: bold; font-size: 0.75em;
            transition: 0.3s; border-bottom: 2px solid transparent;
        }
        .active-astro { color: var(--astro-accent); border-bottom-color: var(--astro-accent); }
        .active-chem { color: var(--chem-accent); border-bottom-color: var(--chem-accent); }

        /* MOBILE OVERLAY TOGGLE */
        #mobile-toggle {
            display: none; position: fixed; bottom: 20px; right: 20px;
            z-index: 1100; background: var(--neon); color: #000;
            border: none; padding: 12px 20px; border-radius: 50px;
            font-weight: bold; box-shadow: 0 0 15px var(--neon);
        }

        /* PANELS */
        .hud-panel {
            position: fixed; background: var(--glass); backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 242, 254, 0.3); border-radius: 12px;
            padding: 15px; z-index: 500; transition: transform 0.4s ease;
        }

        #main-controls { top: 60px; left: 15px; width: 220px; }
        #lab-panel { top: 60px; right: 15px; width: 220px; }
        #telemetry { bottom: 20px; left: 15px; width: 160px; font-size: 0.8em; }

        /* MOBILE SPECIFIC RULES */
        @media (max-width: 768px) {
            #mobile-toggle { display: block; }
            
            .hud-panel {
                top: auto !important; bottom: 80px !important; left: 5% !important;
                width: 90% !important; right: auto !important;
                transform: translateY(150%); /* Hidden by default */
            }

            .hud-panel.show-mobile { transform: translateY(0); }
            
            #telemetry { bottom: 70px; width: 90%; left: 5%; pointer-events: none; }
            #main-controls { z-index: 1001; }
            #lab-panel { z-index: 1002; }
        }

        h2 { margin: 0 0 10px 0; font-size: 0.9em; text-transform: uppercase; color: var(--neon); border-bottom: 1px solid #333; }
        label { font-size: 0.6em; color: #888; display: block; margin-top: 10px; }
        select, input, button { width: 100%; background: #050505; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 5px; margin-top: 5px; font-size: 0.8em; }
        .btn-primary { background: var(--neon); color: #000; border: none; font-weight: bold; cursor: pointer; }
        .btn-nova { background: #ff416c; border: none; font-weight: bold; }

        /* PERSONNEL PORTAL */
        #team-portal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 350px; background: #050505; border: 2px solid var(--neon);
            border-radius: 15px; padding: 20px; display: none; z-index: 2000;
        }
        .team-entry { border-left: 3px solid var(--neon); padding: 5px 10px; margin-bottom: 8px; background: #111; font-size: 0.85em; }
    </style>
</head>
<body>

<div id="top-nav">
    <div id="tab-astro" class="nav-tab active-astro" onclick="switchLab('astro')">Astronomy</div>
    <div id="tab-chem" class="nav-tab" onclick="switchLab('chem')">Chemistry</div>
</div>

<button id="mobile-toggle" onclick="toggleMobileUI()">MENU</button>

<div id="main-controls" class="hud-panel">
    <h2>Control Center</h2>
    <label>Focus</label>
    <select id="cameraTarget" onchange="updateTarget()">
        <option value="Sun">Sun</option>
        <option value="Earth">Earth</option>
        <option value="Jupiter">Jupiter</option>
    </select>
    <label>Time Flow</label>
    <input type="range" id="dt" min="0.0001" max="0.05" step="0.0001" value="0.005">
    <button class="btn-primary" style="margin-top:10px" onclick="togglePortal(true)">TEAM INFO</button>
</div>

<div id="lab-panel" class="hud-panel">
    <div id="astro-content">
        <h2 style="color: var(--astro-accent)">Physics Lab</h2>
        <label>Gravity</label>
        <input type="range" min="1000" max="15000" value="6500" oninput="G = this.value">
        <button style="margin-top:10px" onclick="location.reload()">Reset Sim</button>
    </div>
    <div id="chem-content" style="display:none;">
        <h2 style="color: var(--chem-accent)">Chemistry Lab</h2>
        <label>Composition</label>
        <select onchange="updateStellarColor(this.value)">
            <option value="0xffcc00">Hydrogen</option>
            <option value="0x00f2fe">Ionized</option>
        </select>
        <button class="btn-nova" style="margin-top:10px" onclick="triggerSupernova()">💥 SUPERNOVA</button>
    </div>
</div>

<div id="telemetry" class="hud-panel">
    <div id="tel-name">Target: Sun</div>
</div>

<div id="team-portal">
    <h2 style="text-align: center;">Team Portal</h2>
    <div class="team-entry"><span>Lead Dev:</span> <b>Wabi Tafese</b></div>
    <div class="team-entry"><span>Programmer:</span> <b>Rakeb Tewodros</b></div>
    <div class="team-entry"><span>Research:</span> <b>Henok Yared</b></div>
    <div class="team-entry"><span>Present:</span> <b>Rediet Mebt</b></div>
    <div class="team-entry"><span>Analyst:</span> <b>Aklesiya Negalign</b></div>
    <div class="team-entry"><span>Support:</span> <b>Hemen Tadese</b></div>
    <div class="team-entry"><span>Coord:</span> <b>Arsema Laikemariam</b></div>
    <button class="btn-primary" onclick="togglePortal(false)">CLOSE</button>
</div>

<script>
let scene, camera, renderer, controls, bodies = [], glows = [], targetBody = null, G = 6500, nova = false;

function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 1, 200000);
    camera.position.set(0, 3000, 6000);
    renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    setupUniverse();
    animate();
}

function toggleMobileUI() {
    const panels = document.querySelectorAll('.hud-panel');
    const btn = document.getElementById('mobile-toggle');
    panels.forEach(p => p.classList.toggle('show-mobile'));
    btn.innerText = btn.innerText === "MENU" ? "CLOSE" : "MENU";
}

function switchLab(type) {
    document.getElementById('astro-content').style.display = type === 'astro' ? 'block' : 'none';
    document.getElementById('chem-content').style.display = type === 'chem' ? 'block' : 'none';
    document.getElementById('tab-astro').className = `nav-tab ${type==='astro'?'active-astro':''}`;
    document.getElementById('tab-chem').className = `nav-tab ${type==='chem'?'active-chem':''}`;
}

function setupUniverse() {
    const data = [
        { name: "Sun", m: 5000, d: 0, s: 160, c: 0xffcc00, v: 0 },
        { name: "Earth", m: 10, d: 1200, s: 30, c: 0x2288ff, v: 6.5 },
        { name: "Jupiter", m: 200, d: 2400, s: 90, c: 0xffa500, v: 4.5 }
    ];
    data.forEach(p => {
        const m = new THREE.Mesh(new THREE.SphereGeometry(p.s, 32, 32), new THREE.MeshPhongMaterial({ color: p.c, emissive: p.name==="Sun"?p.c:0 }));
        m.position.set(p.d, 0, 0);
        scene.add(m);
        bodies.push({ name: p.name, m: p.m, mesh: m, pos: new THREE.Vector3(p.d, 0, 0), vel: new THREE.Vector3(0, 0, p.v) });
    });
    targetBody = bodies[0];
    scene.add(new THREE.PointLight(0xffffff, 2, 20000));
    scene.add(new THREE.AmbientLight(0x222233));
}

function updateStellarColor(color) {
    const c = parseInt(color);
    bodies[0].mesh.material.color.setHex(c);
    bodies[0].mesh.material.emissive.setHex(c);
}

function triggerSupernova() { nova = true; }
function togglePortal(s) { document.getElementById('team-portal').style.display = s ? 'block' : 'none'; }
function updateTarget() { targetBody = bodies.find(b => b.name === document.getElementById('cameraTarget').value); }

function animate() {
    requestAnimationFrame(animate);
    const dt = parseFloat(document.getElementById('dt').value);
    bodies.forEach((b, i) => {
        let a = new THREE.Vector3();
        bodies.forEach((p2, j) => {
            if(i !== j) {
                let diff = new THREE.Vector3().subVectors(p2.pos, b.pos);
                a.add(diff.normalize().multiplyScalar((G * p2.m)/(diff.lengthSq() + 20)));
            }
        });
        b.vel.add(a.multiplyScalar(dt));
        b.pos.add(b.vel.clone().multiplyScalar(dt));
        b.mesh.position.copy(b.pos);
    });
    if(nova) {
        bodies[0].mesh.scale.addScalar(1.5);
        if(bodies[0].mesh.scale.x > 100) location.reload();
    }
    if(targetBody) controls.target.lerp(targetBody.pos, 0.1);
    controls.update();
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

init();
</script>
</body>
</html>
