<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interstellar RK4 - Immersive Universe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root {
            --neon: #00f2fe;
            --glass: rgba(0, 7, 25, 0.9);
            --font: 'Segoe UI', system-ui, sans-serif;
            --chem-accent: #39ff14;
            --astro-accent: #ff00ff;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: var(--font); color: white; touch-action: none; }
        
        #top-nav {
            position: fixed; top: 0; left: 0; width: 100%; height: 50px;
            background: var(--glass); border-bottom: 1px solid rgba(0, 242, 254, 0.2);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }

        .nav-tab {
            padding: 10px 15px; cursor: pointer; text-transform: uppercase;
            letter-spacing: 1px; font-weight: bold; font-size: 0.7em; border-bottom: 2px solid transparent;
        }
        .active-astro { color: var(--astro-accent); border-bottom-color: var(--astro-accent); }
        .active-chem { color: var(--chem-accent); border-bottom-color: var(--chem-accent); }

        #mobile-toggle {
            display: none; position: fixed; bottom: 20px; right: 20px;
            z-index: 1100; background: var(--neon); color: #000;
            border: none; padding: 12px 20px; border-radius: 50px;
            font-weight: bold; font-size: 0.9em; box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        .hud-panel {
            position: fixed; background: var(--glass); backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 242, 254, 0.2); border-radius: 15px;
            padding: 20px; z-index: 500; transition: transform 0.4s ease-in-out;
            display: flex; flex-direction: column; box-sizing: border-box;
        }

        #main-controls { top: 70px; left: 20px; width: 260px; }
        #lab-panel { top: 70px; right: 20px; width: 260px; }
        #telemetry { bottom: 20px; left: 20px; pointer-events: none; background:none; border:none; }

        @media (max-width: 768px) {
            #mobile-toggle { display: block; }
            .hud-panel {
                top: auto !important; bottom: 85px !important; left: 5% !important;
                width: 90% !important; right: auto !important;
                max-height: 50vh; overflow-y: auto; transform: translateY(160%);
            }
            .hud-panel.show-mobile { transform: translateY(0); }
        }

        h2 { margin: 0 0 10px 0; font-size: 0.9em; text-transform: uppercase; color: var(--neon); border-bottom: 1px solid #333; }
        label { font-size: 0.65em; color: #aaa; display: block; margin-top: 10px; }
        select, input, button { width: 100%; background: #050a15; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; margin-top: 5px; font-size: 0.85em; }
        .btn-primary { background: var(--neon); color: #000; border: none; font-weight: bold; margin-top: 15px; }
        .btn-nova { background: #ff416c; border: none; font-weight: bold; }

        #team-portal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 380px; background: #02050a; border: 2px solid var(--neon);
            border-radius: 20px; padding: 20px; display: none; z-index: 2000; max-height: 80vh; overflow-y: auto;
        }
        .team-entry { border-left: 3px solid var(--neon); padding: 8px 12px; margin-bottom: 8px; background: #0a1020; }
    </style>
</head>
<body>

<div id="top-nav">
    <div id="tab-astro" class="nav-tab active-astro" onclick="switchLab('astro')">Astronomy</div>
    <div id="tab-chem" class="nav-tab" onclick="switchLab('chem')">Chemistry</div>
</div>

<button id="mobile-toggle" onclick="toggleMobileUI()">MENU</button>

<div id="main-controls" class="hud-panel">
    <h2>Control Center</h2>
    <label>Navigation Focus</label>
    <select id="cameraTarget" onchange="updateTarget(); autoCloseMenu();">
        <option value="Sun">Sun (Center)</option>
        <option value="Mercury">Mercury</option>
        <option value="Venus">Venus</option>
        <option value="Earth">Earth</option>
        <option value="Mars">Mars</option>
        <option value="Jupiter">Jupiter</option>
        <option value="Saturn">Saturn</option>
        <option value="Uranus">Uranus</option>
        <option value="Neptune">Neptune</option>
    </select>
    <label>Time Warp</label>
    <input type="range" id="dt" min="0.0001" max="0.05" step="0.0001" value="0.005">
    <button class="btn-primary" onclick="togglePortal(true)">VIEW TEAM</button>
</div>

<div id="lab-panel" class="hud-panel">
    <div id="astro-content">
        <h2 style="color: var(--astro-accent)">Physics Lab</h2>
        <label>Gravity</label>
        <input type="range" min="1000" max="15000" value="6500" oninput="G = this.value">
        <button style="margin-top:20px" onclick="location.reload()">Reset Universe</button>
    </div>
    <div id="chem-content" style="display:none;">
        <h2 style="color: var(--chem-accent)">Chemistry Lab</h2>
        <label>Composition</label>
        <select onchange="updateStellarColor(this.value); autoCloseMenu();">
            <option value="0xffcc00">Hydrogen/Helium</option>
            <option value="0x00f2fe">Ionized Plasma</option>
            <option value="0xff4b2b">Red Giant</option>
        </select>
        <button class="btn-nova" onclick="triggerSupernova()">💥 TRIGGER SUPERNOVA</button>
    </div>
</div>

<div id="telemetry" class="hud-panel"><div id="tel-name" style="color:var(--neon); font-weight:bold;">Target: Sun</div></div>

<div id="team-portal">
    <h2 style="text-align: center; color:var(--neon)">Personnel Portal</h2>
    <div class="team-entry"><span>Lead Dev:</span><br><b>Wabi Tafese</b></div>
    <div class="team-entry"><span>Programmer:</span><br><b>Rakeb Tewodros</b></div>
    <div class="team-entry"><span>Researcher:</span><br><b>Henok Yared</b></div>
    <div class="team-entry"><span>Presentation:</span><br><b>Rediet Mebt</b></div>
    <div class="team-entry"><span>Data Analyst:</span><br><b>Aklesiya Negalign</b></div>
    <div class="team-entry"><span>Support:</span><br><b>Hemen Tadese</b></div>
    <div class="team-entry"><span>Coordinator:</span><br><b>Arsema Laikemariam</b></div>
    <button class="btn-primary" onclick="togglePortal(false)">CLOSE</button>
</div>

<script>
let scene, camera, renderer, controls, bodies = [], targetBody = null, G = 6500, nova = false;

function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 1, 300000);
    camera.position.set(0, 5000, 10000); // Wide default view
    
    renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // IMMERSIVE UNIVERSE BACKGROUND
    const starGeo = new THREE.BufferGeometry();
    const starPos = [];
    for(let i=0; i<15000; i++) {
        starPos.push((Math.random()-0.5)*150000, (Math.random()-0.5)*150000, (Math.random()-0.5)*150000);
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 1.5, transparent: true, opacity: 0.8})));

    setupUniverse();
    animate();
}

function setupUniverse() {
    const data = [
        { name: "Sun", m: 5000, d: 0, s: 250, c: 0xffcc00, v: 0 },
        { name: "Mercury", m: 5, d: 800, s: 15, c: 0xaaaaaa, v: 8.5 },
        { name: "Venus", m: 8, d: 1300, s: 25, c: 0xe3bb76, v: 7.2 },
        { name: "Earth", m: 10, d: 1800, s: 30, c: 0x2288ff, v: 6.1 },
        { name: "Mars", m: 8, d: 2400, s: 20, c: 0xff5533, v: 5.4 },
        { name: "Jupiter", m: 200, d: 4500, s: 100, c: 0xffa500, v: 4.0 },
        { name: "Saturn", m: 150, d: 6500, s: 85, c: 0xeeddaa, v: 3.2 },
        { name: "Uranus", m: 70, d: 8500, s: 60, c: 0x88ffff, v: 2.8 },
        { name: "Neptune", m: 75, d: 10500, s: 60, c: 0x3366ff, v: 2.5 }
    ];

    data.forEach(p => {
        const mat = new THREE.MeshPhongMaterial({ color: p.c, emissive: p.name==="Sun"?p.c:0, emissiveIntensity: p.name==="Sun"?1:0 });
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(p.s, 32, 32), mat);
        mesh.position.set(p.d, 0, 0);
        scene.add(mesh);
        
        bodies.push({ name: p.name, m: p.m, mesh: mesh, pos: new THREE.Vector3(p.d, 0, 0), vel: new THREE.Vector3(0, 0, p.v) });
    });
    
    targetBody = bodies[0];
    const light = new THREE.PointLight(0xffffff, 2.5, 50000);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x111122));
}

function toggleMobileUI() {
    const panels = [document.getElementById('main-controls'), document.getElementById('lab-panel')];
    const btn = document.getElementById('mobile-toggle');
    panels.forEach(p => p.classList.toggle('show-mobile'));
    btn.innerText = btn.innerText === "MENU" ? "CLOSE" : "MENU";
}

function autoCloseMenu() {
    if (window.innerWidth <= 768) {
        [document.getElementById('main-controls'), document.getElementById('lab-panel')].forEach(p => p.classList.remove('show-mobile'));
        document.getElementById('mobile-toggle').innerText = "MENU";
    }
}

function switchLab(type) {
    document.getElementById('astro-content').style.display = type === 'astro' ? 'block' : 'none';
    document.getElementById('chem-content').style.display = type === 'chem' ? 'block' : 'none';
    document.getElementById('tab-astro').className = `nav-tab ${type==='astro'?'active-astro':''}`;
    document.getElementById('tab-chem').className = `nav-tab ${type==='chem'?'active-chem':''}`;
}

function updateStellarColor(color) {
    const c = parseInt(color);
    bodies[0].mesh.material.color.setHex(c);
    bodies[0].mesh.material.emissive.setHex(c);
}

function triggerSupernova() { nova = true; autoCloseMenu(); }
function togglePortal(s) { document.getElementById('team-portal').style.display = s ? 'block' : 'none'; if(s) autoCloseMenu(); }
function updateTarget() { targetBody = bodies.find(b => b.name === document.getElementById('cameraTarget').value); }

function animate() {
    requestAnimationFrame(animate);
    const dt = parseFloat(document.getElementById('dt').value);
    
    bodies.forEach((b, i) => {
        let a = new THREE.Vector3();
        bodies.forEach((p2, j) => {
            if(i !== j) {
                let diff = new THREE.Vector3().subVectors(p2.pos, b.pos);
                a.add(diff.normalize().multiplyScalar((G * p2.m)/(diff.lengthSq() + 50)));
            }
        });
        b.vel.add(a.multiplyScalar(dt));
        b.pos.add(b.vel.clone().multiplyScalar(dt));
        b.mesh.position.copy(b.pos);
    });

    if(nova) {
        bodies[0].mesh.scale.addScalar(2);
        if(bodies[0].mesh.scale.x > 120) location.reload();
    }
    
    if(targetBody) controls.target.lerp(targetBody.pos, 0.05);
    controls.update();
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

init();
</script>
</body>
</html>
