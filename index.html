<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Planetary RK4 Advanced Laboratory</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js"></script>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
background:black;
}

#panel{
position:absolute;
top:10px;
left:10px;
width:350px;
background:rgba(10,15,40,0.9);
color:white;
padding:15px;
border-radius:10px;
max-height:95vh;
overflow:auto;
}

button,input,select{
width:100%;
margin-top:6px;
padding:6px;
border-radius:6px;
border:none;
}
canvas.energyGraph{
width:100%;
height:120px;
background:#000;
margin-top:8px;
}
</style>
</head>

<body>

<div id="panel">
<h2>Advanced RK4 Planetary Lab</h2>

<button onclick="loadSolarSystem()">Load Real Solar System</button>
<button onclick="toggleAdaptive()">Toggle Adaptive dt</button>

dt:
<input type="number" id="dt" value="0.001" step="0.0001">

Bodies: <span id="count">0</span><br>
Energy: <span id="energy">0</span><br>
Mode: <span id="mode">Fixed</span>

<h3>Energy Graph</h3>
<canvas id="graph" class="energyGraph"></canvas>
</div>

<script>
let scene=new THREE.Scene();
let camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,10000);
let renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

camera.position.set(0,200,800);

let controls=new THREE.OrbitControls(camera,renderer.domElement);

window.addEventListener("resize",()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

/* =========================
   STARFIELD
========================= */

let starsGeometry=new THREE.BufferGeometry();
let starVertices=[];
for(let i=0;i<5000;i++){
starVertices.push(
THREE.MathUtils.randFloatSpread(5000),
THREE.MathUtils.randFloatSpread(5000),
THREE.MathUtils.randFloatSpread(5000)
);
}
starsGeometry.setAttribute('position',
new THREE.Float32BufferAttribute(starVertices,3));
let starsMaterial=new THREE.PointsMaterial({color:0xffffff});
let starField=new THREE.Points(starsGeometry,starsMaterial);
scene.add(starField);

/* =========================
   PHYSICS
========================= */

let bodies=[],meshes=[],trails=[];
let G=0.0003; // scaled
let adaptive=false;

class Body{
constructor(m,pos,vel){
this.m=m;
this.pos=pos.clone();
this.vel=vel.clone();
this.acc=new THREE.Vector3();
}
}

function computeAcceleration(i){
let acc=new THREE.Vector3();
for(let j=0;j<bodies.length;j++){
if(i===j) continue;
let diff=bodies[j].pos.clone().sub(bodies[i].pos);
let dist=diff.length()+0.1;
let force=G*bodies[j].m/(dist*dist);
acc.add(diff.normalize().multiplyScalar(force));
}
return acc;
}

function rk4Step(dt){

let original=bodies.map(b=>({pos:b.pos.clone(),vel:b.vel.clone()}));

let k1=[],k2=[],k3=[],k4=[];

for(let i=0;i<bodies.length;i++){
bodies[i].acc=computeAcceleration(i);
k1.push({v:bodies[i].vel.clone(),a:bodies[i].acc.clone()});
}

for(let i=0;i<bodies.length;i++){
bodies[i].pos=original[i].pos.clone().add(k1[i].v.clone().multiplyScalar(dt/2));
bodies[i].vel=original[i].vel.clone().add(k1[i].a.clone().multiplyScalar(dt/2));
}

for(let i=0;i<bodies.length;i++){
bodies[i].acc=computeAcceleration(i);
k2.push({v:bodies[i].vel.clone(),a:bodies[i].acc.clone()});
}

for(let i=0;i<bodies.length;i++){
bodies[i].pos=original[i].pos.clone().add(k2[i].v.clone().multiplyScalar(dt/2));
bodies[i].vel=original[i].vel.clone().add(k2[i].a.clone().multiplyScalar(dt/2));
}

for(let i=0;i<bodies.length;i++){
bodies[i].acc=computeAcceleration(i);
k3.push({v:bodies[i].vel.clone(),a:bodies[i].acc.clone()});
}

for(let i=0;i<bodies.length;i++){
bodies[i].pos=original[i].pos.clone().add(k3[i].v.clone().multiplyScalar(dt));
bodies[i].vel=original[i].vel.clone().add(k3[i].a.clone().multiplyScalar(dt));
}

for(let i=0;i<bodies.length;i++){
bodies[i].acc=computeAcceleration(i);
k4.push({v:bodies[i].vel.clone(),a:bodies[i].acc.clone()});
}

for(let i=0;i<bodies.length;i++){

let dp=k1[i].v.clone()
.add(k2[i].v.clone().multiplyScalar(2))
.add(k3[i].v.clone().multiplyScalar(2))
.add(k4[i].v.clone())
.multiplyScalar(dt/6);

let dv=k1[i].a.clone()
.add(k2[i].a.clone().multiplyScalar(2))
.add(k3[i].a.clone().multiplyScalar(2))
.add(k4[i].a.clone())
.multiplyScalar(dt/6);

bodies[i].pos=original[i].pos.clone().add(dp);
bodies[i].vel=original[i].vel.clone().add(dv);
}
}

/* =========================
   ENERGY GRAPH
========================= */

let graphCanvas=document.getElementById("graph");
let gctx=graphCanvas.getContext("2d");
let energyHistory=[];

function calculateEnergy(){
let KE=0,PE=0;
for(let i=0;i<bodies.length;i++){
KE+=0.5*bodies[i].m*bodies[i].vel.lengthSq();
for(let j=i+1;j<bodies.length;j++){
let dist=bodies[i].pos.distanceTo(bodies[j].pos)+0.1;
PE-=G*bodies[i].m*bodies[j].m/dist;
}
}
let total=KE+PE;
document.getElementById("energy").innerText=total.toFixed(5);
return total;
}

function drawGraph(){
gctx.clearRect(0,0,graphCanvas.width,graphCanvas.height);
gctx.strokeStyle="lime";
gctx.beginPath();
for(let i=0;i<energyHistory.length;i++){
let y=60-energyHistory[i]*20000;
if(i===0) gctx.moveTo(i,y);
else gctx.lineTo(i,y);
}
gctx.stroke();
}

/* =========================
   SOLAR SYSTEM DATA
========================= */

function loadSolarSystem(){
scene.children.slice().forEach(obj=>{
if(obj.type==="Mesh"||obj.type==="Line") scene.remove(obj);
});
bodies=[]; meshes=[]; trails=[]; energyHistory=[];

let data=[
{m:100000,pos:[0,0,0],vel:[0,0,0],color:0xffff00},
{m:1,pos:[100,0,0],vel:[0,0,3.5],color:0xaaaaaa},
{m:2,pos:[150,0,0],vel:[0,0,3],color:0xffaa00},
{m:3,pos:[200,0,0],vel:[0,0,2.8],color:0x0000ff},
{m:0.5,pos:[250,0,0],vel:[0,0,2.4],color:0xff0000}
];

for(let d of data){
let body=new Body(d.m,
new THREE.Vector3(...d.pos),
new THREE.Vector3(...d.vel));
bodies.push(body);

let mesh=new THREE.Mesh(
new THREE.SphereGeometry(8),
new THREE.MeshBasicMaterial({color:d.color})
);
scene.add(mesh);
meshes.push(mesh);

let trailGeom=new THREE.BufferGeometry().setFromPoints([]);
let trailMat=new THREE.LineBasicMaterial({color:d.color});
let trail=new THREE.Line(trailGeom,trailMat);
scene.add(trail);
trails.push(trail);
}

document.getElementById("count").innerText=bodies.length;
}

/* =========================
   ADAPTIVE MODE
========================= */

function toggleAdaptive(){
adaptive=!adaptive;
document.getElementById("mode").innerText=
adaptive?"Adaptive":"Fixed";
}

/* =========================
   ANIMATION
========================= */

function animate(){
let dt=parseFloat(document.getElementById("dt").value);
if(adaptive) dt*=0.99+Math.random()*0.02;

rk4Step(dt);

for(let i=0;i<bodies.length;i++){
meshes[i].position.copy(bodies[i].pos);

let points=trails[i].geometry.attributes.position?
Array.from(trails[i].geometry.attributes.position.array):[];

points.push(bodies[i].pos.x,bodies[i].pos.y,bodies[i].pos.z);

let newGeom=new THREE.BufferGeometry();
newGeom.setAttribute('position',
new THREE.Float32BufferAttribute(points,3));
trails[i].geometry.dispose();
trails[i].geometry=newGeom;
}

let energy=calculateEnergy();
energyHistory.push(energy);
if(energyHistory.length>300) energyHistory.shift();
drawGraph();

controls.update();
renderer.render(scene,camera);
requestAnimationFrame(animate);
}

loadSolarSystem();
animate();
</script>
</body>
</html>
