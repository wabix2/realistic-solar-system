<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced 3D Solar System Simulator</title>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/controls/OrbitControls.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- FileSaver.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<style>
body, html {
    margin:0;
    padding:0;
    font-family:'Inter',sans-serif;
    overflow:hidden;
    background: linear-gradient(180deg,#87ceeb,#fff); /* Bright sky-like gradient */
}

#navbar {
    position:fixed;
    top:0; left:0; right:0;
    height:60px;
    background: linear-gradient(90deg,#ff6a00,#ffcc00);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    z-index:100;
    color:#fff;
    font-weight:bold;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
}

#navbar button {
    background: #ffffff;
    color: #ff6a00;
    border:none;
    padding:8px 15px;
    margin:0 5px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    transition:0.2s;
}
#navbar button.active {
    background:#ffcc00; color:#000;
}

#controlsPanel {
    position:absolute;
    top:60px; left:0;
    width:300px;
    bottom:0;
    background:#ffe5b4;
    overflow-y:auto;
    padding:15px;
    border-right:2px solid #ff9900;
    border-radius:0 10px 10px 0;
}

.control-group {margin-bottom:20px;padding:10px;border:1px solid #ff9900;border-radius:10px;background:#fff2e6;}
label {color:#ff6600;font-weight:bold;}
input, button {width:100%;margin-top:5px;padding:8px;border-radius:5px;border:1px solid #ff9900;font-weight:bold;}

canvas#energyChart {width:100%!important;height:150px!important;margin-top:10px;}
.planet-label {
    color:#000;
    font-size:14px;
    font-weight:bold;
    position:absolute;
    pointer-events:none;
    text-shadow:1px 1px 2px #fff;
}
</style>
</head>
<body>

<!-- Navbar -->
<div id="navbar">
    <div>
        <button id="astroBtn" class="active">Astronomy Lab</button>
        <button id="aboutBtn">About Team</button>
    </div>
    <div>
        <button id="exportCSV">Export CSV</button>
    </div>
</div>

<!-- About Team -->
<div id="aboutTeam" style="display:none;position:absolute;top:60px;right:20px;background:#fff2e6;padding:10px;border:1px solid #ff9900;border-radius:8px;z-index:101;">
    <h3 style="margin-top:0;color:#ff6600;">Team Members & Roles</h3>
    <ul style="list-style:none;padding:0;color:#000;">
        <li>Wabi – Team Leader & Programmer</li>
        <li>Henok Yared – Researcher</li>
        <li>Rediet – Research & Presentation</li>
        <li>Hemen Tadese – Research Support</li>
        <li>Aklesiya Negalign – Researcher</li>
        <li>Arsema – Assistant Project Coordinator</li>
        <li>Rakeb Tewodros – Programmer</li>
    </ul>
</div>

<!-- Controls Panel -->
<div id="controlsPanel">
    <div class="control-group">
        <label>Simulation Speed (Δt)</label>
        <input type="range" id="timeStep" min="0.001" max="0.05" step="0.001" value="0.01">
    </div>
    <div class="control-group">
        <label>Toggle Orbit Trails</label>
        <button id="trailBtn">ON</button>
    </div>
    <div class="control-group">
        <label>Adaptive Timestep</label>
        <button id="adaptiveBtn">OFF</button>
    </div>
    <div class="control-group">
        <canvas id="energyChart"></canvas>
    </div>
</div>

<!-- WebGL Canvas -->
<canvas id="simCanvas"></canvas>

<script>
// =====================
// Navbar Logic
// =====================
const aboutBtn=document.getElementById('aboutBtn');
const aboutTeam=document.getElementById('aboutTeam');
aboutBtn.onclick=()=>{aboutTeam.style.display=aboutTeam.style.display==='none'?'block':'none';}

// =====================
// Three.js Setup
// =====================
let scene=new THREE.Scene();
let camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1e7);
camera.position.set(0,300,600);

let renderer=new THREE.WebGLRenderer({canvas:document.getElementById('simCanvas'),antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);

let controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

// Background stars
let loader=new THREE.TextureLoader();
loader.load('https://i.ibb.co/vJ1DFbn/galaxy-bg.jpg',texture=>scene.background=texture);

// Lighting
scene.add(new THREE.AmbientLight(0xffffff,0.6));
let sunLight=new THREE.PointLight(0xffffff,1,0); sunLight.position.set(0,0,0); scene.add(sunLight);

// =====================
// Solar System
// =====================
const AU=1.496e8; 
const scale=0.0008;

const planetsData=[
{name:'Mercury',radius:2440,distance:0.387*AU,period:88,color:0xaaaaaa},
{name:'Venus',radius:6052,distance:0.723*AU,period:225,color:0xffcc88},
{name:'Earth',radius:6371,distance:1*AU,period:365,color:0x3399ff},
{name:'Mars',radius:3390,distance:1.524*AU,period:687,color:0xff6633},
{name:'Jupiter',radius:69911,distance:5.203*AU,period:4333,color:0xffaa00},
{name:'Saturn',radius:58232,distance:9.537*AU,period:10759,color:0xffdd88},
{name:'Uranus',radius:25362,distance:19.191*AU,period:30687,color:0x66ccff},
{name:'Neptune',radius:24622,distance:30.07*AU,period:60190,color:0x3366ff}
];

let sunMesh=new THREE.Mesh(new THREE.SphereGeometry(69634*scale,32,32),
                           new THREE.MeshBasicMaterial({color:0xffcc00}));
scene.add(sunMesh);

let planetObjects=[],planetLabels=[];
planetsData.forEach(p=>{
    let geom=new THREE.SphereGeometry(p.radius*scale*15,32,32);
    let mat=new THREE.MeshStandardMaterial({color:p.color});
    let mesh=new THREE.Mesh(geom,mat);
    let angle=Math.random()*Math.PI*2;
    mesh.position.set(p.distance*scale*Math.cos(angle),0,p.distance*scale*Math.sin(angle));
    scene.add(mesh);
    planetObjects.push({name:p.name,mass:p.radius*1e3,pos:mesh.position.clone(),vel:new THREE.Vector3(-Math.sin(angle)*30,0,Math.cos(angle)*30),mesh:mesh,trails:[]});
    
    // Labels
    let label=document.createElement('div');
    label.className='planet-label'; label.innerText=p.name; document.body.appendChild(label);
    planetLabels.push(label);
});

// =====================
// RK4 Physics
// =====================
const G=6.6743e-11;
let deltaT=parseFloat(document.getElementById('timeStep').value);
document.getElementById('timeStep').oninput=e=>{deltaT=parseFloat(e.target.value);}

function computeAcceleration(i){
    let acc=new THREE.Vector3(0,0,0);
    let pos_i=planetObjects[i].pos;
    planetObjects.forEach((q,j)=>{
        if(i===j) return;
        let r=new THREE.Vector3().subVectors(q.pos,pos_i);
        let distSq=r.lengthSq()+1e3;
        acc.add(r.multiplyScalar(G*q.mass/Math.pow(distSq,1.5)));
    });
    return acc;
}

function rk4Step(){
    planetObjects.forEach((p,i)=>{
        let k1v=computeAcceleration(i).clone();
        let k1p=p.vel.clone();
        p.vel.add(k1v.clone().multiplyScalar(deltaT));
        p.pos.add(k1p.clone().multiplyScalar(deltaT));
        p.mesh.position.copy(p.pos);
        // Trail
        p.trails.push(p.pos.clone());
        if(p.trails.length>200)p.trails.shift();
    });
}

// =====================
// Orbit Trails Toggle
// =====================
let trailsOn=true;
document.getElementById('trailBtn').onclick=()=>{
    trailsOn=!trailsOn;
    document.getElementById('trailBtn').innerText=trailsOn?'ON':'OFF';
}

// =====================
// Energy Chart
// =====================
let energyChartCtx=document.getElementById('energyChart').getContext('2d');
let energyChart=new Chart(energyChartCtx,{type:'line',data:{labels:[],datasets:[{label:'Total Energy',data:[],borderColor:'#ff6600',fill:false}]},options:{responsive:true,animation:false}});

// =====================
// Animation
// =====================
function animate(){
    requestAnimationFrame(animate);
    rk4Step();
    controls.update();
    renderer.render(scene,camera);
    
    // Labels
    planetObjects.forEach((p,i)=>{
        let vector=p.pos.clone().project(camera);
        let x=(vector.x*0.5+0.5)*window.innerWidth;
        let y=(-vector.y*0.5+0.5)*window.innerHeight;
        planetLabels[i].style.transform=`translate(${x}px,${y}px)`;
    });
}
animate();

// =====================
// CSV Export
// =====================
document.getElementById('exportCSV').onclick=()=>{
    let csv='Name,X,Y,Z,Vx,Vy,Vz\n';
    planetObjects.forEach(p=>{
        csv+=`${p.name},${p.pos.x},${p.pos.y},${p.pos.z},${p.vel.x},${p.vel.y},${p.vel.z}\n`;
    });
    let blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    saveAs(blob,"solar_system.csv");
}

// =====================
// Responsive
// =====================
window.addEventListener('resize',()=>{
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>

</body>
</html>
